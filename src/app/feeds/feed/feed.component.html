<main class="main-content">
  <app-loader *ngIf="!items && !errorMessage"></app-loader>
  <app-error-message [message]="errorMessage" *ngIf="!items && errorMessage !== ''"></app-error-message>

  <section *ngIf="items" aria-labelledby="feed-title">
    <div class="feed-header">
      <div>
        <span class="eyebrow">Hacker News · Page {{ pageNum }}</span>
        <h1 id="feed-title">{{ feedTitle }}</h1>
        <p>{{ feedDescription }}</p>
      </div>
      <span class="story-count">{{ items.length }} stories</span>
    </div>

    <ol class="story-list" start="{{ listStart }}">
      <li *ngFor="let item of items; trackBy: trackById" class="post">
        <item class="item-block" [item]="item"></item>
      </li>
    </ol>

    <nav class="pagination" aria-label="Story pages">
      <a *ngIf="listStart !== 1" [routerLink]="['/' + feedType, pageNum - 1]" class="page-link prev">‹ Previous</a>
      <span class="current-page">Page {{ pageNum }}</span>
      <a *ngIf="items.length === 30" [routerLink]="['/' + feedType, pageNum + 1]" class="page-link more">Next ›</a>
    </nav>
  </section>
</main>
