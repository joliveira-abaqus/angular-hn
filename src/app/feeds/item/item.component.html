<article class="story" [style.margin-bottom.px]="settings().listSpacing">
  <div class="story-heading">
    <a *ngIf="hasUrl" class="title" [style.font-size.px]="settings().titleFontSize" href="{{ item.url }}" [attr.target]="settings().openLinkInNewTab ? '_blank' : null" [attr.rel]="settings().openLinkInNewTab ? 'noopener' : null">
      {{ item.title }}
    </a>
    <a *ngIf="!hasUrl" class="title" [style.font-size.px]="settings().titleFontSize" [routerLink]="['/item', item.id]" routerLinkActive="active">
      {{ item.title }}
    </a>
    <span *ngIf="item.domain" class="domain">{{ item.domain }}</span>
  </div>

  <div class="meta">
    <span *ngIf="item.type !== 'job'" class="points">{{ item.points }} points</span>
    <span *ngIf="item.type !== 'job'">by <a [routerLink]="['/user', item.user]" routerLinkActive="active">{{ item.user }}</a></span>
    <span>{{ item.time_ago }}</span>
    <a *ngIf="item.type !== 'job'" class="comments" [routerLink]="['/item', item.id]" routerLinkActive="active">{{ item.comments_count | comment }}</a>
  </div>
</article>
