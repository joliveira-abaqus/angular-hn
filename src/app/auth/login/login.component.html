<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <span class="eyebrow">Hacker News · Account</span>
    <h1 id="login-title">Sign in</h1>
    <p class="lead">Sign in to save favorites and access your profile.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid">
        <small class="field-error" *ngIf="hasError('email', 'required')">Email is required.</small>
        <small class="field-error" *ngIf="hasError('email', 'email')">Enter a valid email address.</small>
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid">
        <small class="field-error" *ngIf="hasError('password', 'required')">Password is required.</small>
        <small class="field-error" *ngIf="hasError('password', 'minlength')">Password must have at least 6 characters.</small>
      </label>

      <p class="form-error" role="alert" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <button class="submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
