language: node_js
node_js:
  - "22"

branches:
  only:
    - main

cache: npm

install:
  - npm ci
  - npx playwright install --with-deps chromium

script:
  - npm run lint
  - npm test
  - npm run build
  - npm run e2e

before_deploy:
  - npm install -g firebase-tools

deploy:
  provider: script
  script: firebase use default && firebase deploy --only hosting --token $FIREBASE_TOKEN
  skip_cleanup: true
  on:
    branch: main

notifications:
  email:
    on_failure: change
    on_success: change
